name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPOTHESIS_PROFILE: ci # 1,000 examples per property instead of 100

jobs:
  python:
    name: Lint, type-check and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: make install
      - run: make check

  terraform:
    name: Terraform
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.4
          terraform_wrapper: false
      - run: make tf-check

  images:
    name: Image (${{ matrix.service }})
    needs: [python, terraform]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # lets main authenticate to Google Cloud without a stored key
    strategy:
      matrix:
        service: [engine, signer]
    env:
      # Publish from main once the registry exists and its secrets are set
      # (docs/runbook.md, first-time setup). Until then, CI only builds.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.WORKLOAD_IDENTITY_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: docker build --file services/${{ matrix.service }}/Dockerfile --tag autolister-${{ matrix.service }} .
      - name: Authenticate to Google Cloud
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v0
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Log in to Artifact Registry
        if: steps.auth.outcome == 'success'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Push
        if: steps.auth.outcome == 'success'
        env:
          IMAGE: ${{ secrets.ARTIFACT_REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
        run: |
          docker tag autolister-${{ matrix.service }} "$IMAGE"
          docker push "$IMAGE"
