# Tool configuration shared by every package in the repository. Each package has
# its own pyproject.toml for packaging, tests and coverage.

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["autolister_core", "autolister_engine", "autolister_signer"]
known_local_folder = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["libs/core/src", "services/engine/src", "services/signer/src"]
mypy_path = ["libs/core/src", "services/engine/src", "services/signer/src"]
namespace_packages = true  # google.cloud
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Libraries that ship without type information (as of late 2022).
module = ["eth_abi.*", "eth_account.*", "google.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Typed, but their public names are re-exported implicitly.
module = ["eth_abi", "eth_utils"]
implicit_reexport = true
